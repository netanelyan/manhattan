<!doctype html>
<!-- Source for website/og-image.png (1200x630). Regenerate with tools/build-seo-assets.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>og image</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Inter:wght@500;600;700&display=block" rel="stylesheet">
<style>
  :root { --bg: #0a0c0b; --line: #2b3630; --text: #edf2ee; --muted: #98a59c; --accent: #9fd49f; --cell: #5785bd; --power: #d15742; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body { font-family: Inter, sans-serif; color: var(--text); position: relative; }
  .glow { position: absolute; inset: 0;
    background: radial-gradient(520px 320px at 12% 10%, rgba(159,212,159,.13), transparent 70%),
                radial-gradient(600px 400px at 88% 80%, rgba(87,133,189,.16), transparent 70%); }
  .shot {
    position: absolute; left: 640px; top: 70px; width: 700px; height: 490px;
    border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: #0c0e0d;
    box-shadow: 0 40px 90px -30px rgba(0,0,0,.9);
  }
  .bar { height: 34px; border-bottom: 1px solid #1f2723; background: #0f1311; display: flex; align-items: center; gap: 7px; padding: 0 14px; }
  .bar i { width: 10px; height: 10px; border-radius: 50%; background: #26302a; }
  .shot img { display: block; width: 100%; height: calc(100% - 35px); object-fit: cover; object-position: 20% 30%; }
  .copy { position: absolute; left: 72px; top: 64px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 28px; letter-spacing: -0.02em; }
  .mark { display: grid; grid-template: 1fr 1fr / 1fr 1fr; gap: 3px; width: 32px; height: 32px; }
  .mark i { border-radius: 2px; }
  .mark i:nth-child(1) { grid-row: 1 / 3; background: var(--accent); }
  .mark i:nth-child(2) { background: var(--cell); }
  .mark i:nth-child(3) { background: var(--power); }
  h1 { margin: 54px 0 0; font-size: 66px; line-height: 1.02; letter-spacing: -0.045em; font-weight: 700; }
  p { margin: 22px 0 0; font-size: 22px; line-height: 1.45; color: var(--muted); white-space: nowrap; }
  .stats { position: absolute; left: 72px; bottom: 58px; display: flex; gap: 34px; }
  .stats div { display: flex; flex-direction: column; gap: 4px; }
  .stats b { font: 500 30px 'IBM Plex Mono', monospace; letter-spacing: -0.04em; color: #c3e8c3; }
  .stats span { font-size: 15px; color: var(--muted); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="shot"><div class="bar"><i></i><i></i><i></i></div><img src="../website/img/gcd-cells.webp" alt=""></div>
  <div class="copy">
    <div class="brand"><span class="mark"><i></i><i></i><i></i></span>Manhattan</div>
    <h1>The whole chip,<br>in a browser tab.</h1>
    <p>A chip-layout viewer built on Rust and WebGL2.</p>
  </div>
  <div class="stats">
    <div><b>349M</b><span>placements, 1 tile fetch</span></div>
    <div><b>2.4 s</b><span>LEF/DEF to view</span></div>
    <div><b>20 KB</b><span>Rust core, gzipped</span></div>
  </div>
</body>
</html>
